# Configurazione di odoo_csv_check.py (esempio per Embyon -> Ridix)
# I percorsi relativi sono riferiti alla directory di questo file.
[main]
# Directory con i file {NOME}_[0|1]_{YYYYmmdd}_{HHMM}.csv
data_dir = /home/odoo/ridix
# {NOME} file -> modello Odoo e colonna chiave (counterpart_pk)
dirmap_file = ./odoo_csv_check_dirmap.csv
# Colonna del file -> campo Odoo, default, obbligatorietà (req)
mapper_file = ./odoo_csv_check_mapper.csv
# Campi Odoo 18.0 (csv o xlsx) con colonne model, name, ttype, relation
# (facoltative required, module, selection); si genera dal codice con
#   odoo_csv_check_fields.py -c /etc/odoo/odoo18-ee.conf -d ridix18 ~/odoo18
fields_file = ./odoo_csv_check_fields.csv
# fields_sheet = Foglio1
# Solo le righe di dirmap/mapper di questo backend (vuoto = tutte)
backend = Embyon Ridix
# Report: estensione .pdf (serve wkhtmltopdf), .md, .xlsx (serve openpyxl) o .ods
report_file = ./report_%(datetime)s.pdf
encoding = utf-8-sig
# Regex dei nomi file accettati (gruppi: name, date, time facoltativi);
# default: data e ora facoltative, separatore "_" o "-" prima della data.
# I nomi non conformi alla specifica vengono comunque segnalati.
# file_pattern = ^(?P<name>.+?)(_[01])?([-_](?P<date>\d{8})(_(?P<time>\d{4}))?)?\.csv$
# Confronto dei riferimenti senza distinzione maiuscole/minuscole
ref_ignore_case = true
# {NOME} assente in dirmap: usa la mappatura del NOME più lungo che ne è
# prefisso (es. VARIANTI_BLASER_KG -> VARIANTI_BLASER)
prefix_match = true

[alias]
# Pattern del {NOME} (glob, come filename_pattern dell'importatore) = {NOME}
# di dirmap: per gli export con nomi diversi da dirmap; vale prima di
# prefix_match (che assocerebbe questi file ad ASSEGNAZIONE_AGENTE)
ASSEGNAZIONE_AGENTE_PROV* = ASSEGNAZIONE_AGENTE_PROVINCIA
ASSEGNAZIONE_AGENTE_CLIENT* = ASSEGNAZIONE_AGENTE_CLIENTE

[keys]
# Colonne chiave aggiuntive a counterpart_pk, per {NOME} o per modello
TITOLO_CONTATTO = SIGLA
# codice fornitore (embyon2_code): gli agenti sono cercati anche tra i clienti
ANAGRAFICACF = CODCONTO_FOR
# codici fornitore degli agenti (ASSEGNAZIONE_AGENTE marca il partner come agente)
ASSEGNAZIONE_AGENTE = CODCONTO_FOR

[external]
# Modelli già presenti in Odoo: i riferimenti non vengono verificati
models = res.country, res.country.state, res.lang, res.currency, res.users,
    res.company, res.bank, uom.uom, account.tax, account.account,
    account.incoterms, account.fiscal.position, account.payment.term,
    account.payment.method.line, account.intrastat.code, stock.route,
    stock.location, stock.warehouse, product.attribute, product.attribute.value,
    product.template.attribute.value, env.contribution.product.category,
    sale.delivery.block.reason, sale.invoice.frequency,
    sale.invoicing.grouping.criteria

[equivalent]
# Modello = altri modelli le cui chiavi valgono anche per esso
product.product = product.template
product.template = product.product

[hierarchy]
# Modello = separatore: le chiavi sono percorsi "A / B / C" e anche ogni
# prefisso ("A", "A / B") è un riferimento valido
product.category = /

[ignore]
# {NOME} = colonne da non controllare (non vengono nemmeno segnalate come
# assenti dal mapper)
AUT_BLOCCO = ACA
# nomi commerciali: l'agente si risolve dal codice CODCONTO_FOR (il nome è
# solo il ripiego dell'importatore e non coincide con la ragione sociale)
ASSEGNAZIONE_AGENTE_CLIENTE = DSCAGENTE, DSCONTO1
ASSEGNAZIONE_AGENTE_PROVINCIA = DSCAGENTE

[unique_only]
# {NOME} = colonne: il file viene controllato solo per i valori ripetuti in
# ciascuna colonna (nessun altro controllo)
ASSEGNAZIONE_AGENTE = DSCAGENTE, DSCAGENTE2

[row_ref]
# {NOME} = colonna codice: colonne. Gli errori di una riga del file riportano
# accanto al numero di riga il codice del record (es. 198 (C  1904)), per
# correggere a mano il database di origine; nei fogli xlsx/ods è nella colonna
# Codice. Nel PDF, dove gli errori uguali sono raggruppati, il codice compare
# per le colonne indicate e per le voci con una sola riga.
ANAGRAFICACF = CODCONTO: PARTITAIVA, CODFISCALE, EMAILAZIENDA, PECAZIENDA,
    SITOWEBAZIENDA
SUPPLIERS = CODCONTO: PARTITAIVA, CODFISCALE, EMAILAZIENDA, PECAZIENDA,
    SITOWEBAZIENDA

[lookup_only]
# {NOME}.colonna = file: colonna, oppure {NOME}.colonna = modello. Il file
# viene controllato solo per i valori della colonna, che devono comparire
# nella colonna dell'altro file (nome file in data_dir o {NOME}; separatore
# | ; , o tab; intestazione senza distinzione maiuscole/minuscole) oppure
# tra le chiavi dei file dati del modello. Il file dei valori, se assente
# in dirmap, non viene controllato. Si applica anche [unique] del file.
# agente del listino provvigionale = "Nome provvigione" dell'elenco agenti
LISTINO_PROVVIGIONALE.DSCAGENTE = Agenti.csv: Nome provvigione
# giacenze: il codice articolo deve essere un prodotto dei file dati
GIACENZE.CODART = product.product

[purge]
# Funzione temporanea: {NOME} = data (YYYY-MM-DD). Solo in quella data i
# record con errori vengono tolti dal file, che viene riscritto (l'originale
# resta in {file}.bak); le righe rimosse restano elencate nel report.
GIACENZE = 2026-10-15

[unique]
# {NOME} = colonne: il file non deve avere due righe con la stessa
# combinazione di valori di tutte le colonne indicate (gli altri controlli
# vengono eseguiti comunque)
ASSEGNAZIONE_AGENTE_CLIENTE = CODCONTO, DSCAGENTE
ASSEGNAZIONE_AGENTE_PROVINCIA = DSCAGENTE, ODOO_CATEGORY, NAZIONE, PROVINCIA, CAP
# una sola riga per articolo e magazzino (vale anche con [lookup_only])
GIACENZE = CODART, MAGAZZINO

[requires]
# {NOME}.colonna = colonne che devono avere un valore nelle righe in cui la
# colonna ha un valore
ASSEGNAZIONE_AGENTE_PROVINCIA.PROVINCIA = NAZIONE

[required]
# Modello = campi Odoo che devono avere un valore in ogni riga dei file di
# quel modello (oltre ai req del mapper); il default del mapper non basta:
# il valore deve essere nel file
product.template = categ_id
product.product = categ_id

[ref_files]
# Riferimenti verificati solo sulle chiavi dei file indicati ({NOME}); gli
# altri file del modello (es. AUT_BLOCCO, CONTATTI: estensioni
# dell'anagrafica) non contano. modello.campo = {NOME}, ...
# {NOME}.campo vale solo per quel file e prevale su modello.campo.
res.partner.parent_id = ANAGRAFICACF, SUPPLIERS
# i contatti possono appartenere anche a un indirizzo di consegna
CONTATTI.parent_id = ANAGRAFICACF, SUPPLIERS, DIFF_LOCATIONS_CUSTOMERS
# agenti per codice fornitore (CODCONTO_FOR = embyon2_code), come l'importatore
ASSEGNAZIONE_AGENTE_CLIENTE.agent_ids = SUPPLIERS, ANAGRAFICACF, ASSEGNAZIONE_AGENTE
ASSEGNAZIONE_AGENTE_PROVINCIA.assignment_id = ASSEGNAZIONE_AGENTE

[ref_suffix]
# Modello collegato = testo con cui devono terminare i riferimenti a quel
# modello in tutti i file, tranne quelli in exclude ({NOME} esatto).
# Le categorie prodotto foglia terminano con "." (le intermedie no, e sono
# usate solo in CATEGORIE_PRODOTTI come padre)
product.category = .
exclude = CATEGORIE_PRODOTTI, CONTATTI, CONTATTI_SUPPLIERS, CLIENTI_DI_RIVENDITORI,
    ASSEGNAZIONE_AGENTE_PROVINCIA

[ref_insert]
# Riferimenti mancanti che non sono errori del file ma record da inserire
# nel file del modello collegato: modello.campo o {NOME}.campo = {NOME}
res.partner.category_id = ETICHETTE_CLIENTI
product.template.categ_id = CATEGORIE_PRODOTTI
product.product.categ_id = CATEGORIE_PRODOTTI

[ref_child_email]
# Riferimenti espressi come e-mail di contatti figli del partner della riga
# (come l'importatore: ricerca per padre + e-mail, i mancanti vengono creati).
# {NOME}.campo o modello.campo = campo che lega il figlio al padre
# es. res.partner.extra_sale_partner_ids = parent_id

[ref_search]
# Riferimento non trovato: cerca l'e-mail e la partita IVA della riga nei file
# di anagrafica indicati ({NOME}) e mostra i record con la stessa e-mail e/o
# la stessa partita IVA oppure, se non ce ne sono, quelli con lo stesso
# dominio e-mail. modello.campo = {NOME}, ...
res.partner.parent_id = ANAGRAFICACF, SUPPLIERS
# Domini di provider pubblici e PEC: se l'e-mail esatta non c'è, la ricerca
# per dominio non viene fatta. Senza questa riga vale l'elenco predefinito
# nel codice (PUBLIC_EMAIL_DOMAINS); questa riga lo sostituisce per intero.
# public_domains = libero.it, tin.it, gmail.com, ...

[vat_match]
# {NOME} = altri {NOME}: sezione del report, prima dei file, con i record
# che hanno la stessa partita IVA (campo vat) nei due file: chiave, partita
# IVA e codice IVA (campo property_account_position_id) di entrambi e nome
# (campo name) del primo. Non sono errori
# (es. lo stesso soggetto importato come cliente e come fornitore)
ANAGRAFICACF = SUPPLIERS

[ref_values]
# Valori sempre validi per un riferimento anche se assenti dai file dati
# (record già in Odoo). modello.campo o {NOME}.campo = valori separati da
# virgola; {NOME}.campo prevale su modello.campo.
# Listini 1 (acquisto), 2 (vendita), 3 (CHF) di RIGHE_LISTINO1/2/3
product.pricelist.item.pricelist_id = 1, 2, 3

[selection]
# Valori validi delle selection dinamiche (calcolate a runtime, senza valori
# nel file dei campi): modello.campo = valori separati da virgola.
# Sovrascrivono i valori del file dei campi.
# Lingue attive in ridix18: select code from res_lang where active
res.partner.lang = en_GB, en_US, it_IT
