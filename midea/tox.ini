[tox]
envlist =
    py38
    py39
    py310
    py311
    py312
    py313
skip_missing_interpreters = true

[testenv]
description = Run pytest with coverage
deps =
    pytest>=7.0
    pytest-cov>=4.0
commands =
    pytest {posargs}

[testenv:coverage-report]
description = Generate coverage report only (reuse .coverage from a previous run)
deps =
    coverage>=7.0
commands =
    coverage report -m
    coverage html

[testenv:lint]
description = Run basic linting checks
deps =
    flake8
commands =
    flake8 midea tests
