[metadata]
name = midea
version = 1.0.0
description = Simple app to test
author = Antonio Maria Vigliotti
author_email = antoniomaria.vigliotti@gmail.com
license = GPL-3.0-or-later
url = http://zeroincombenze.it

[options]
packages = find:
python_requires = >=3.8
zip_safe = False

[options.packages.find]
exclude =
    docs
    examples
    tests
    egg-info
    junk

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=midea
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

[coverage:run]
source = midea
omit =
    */tests/*
    */test_*.py
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if 0:
    if False:
show_missing = True
